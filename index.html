<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Ellison</title>
<meta name="description" content="Matt Ellison — finance across FP&amp;A, M&amp;A, and investment management, with a focus on macroeconomic structure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --grad-top:#A8C8E0;
    --grad-mid:#DCEAF5;
    --grad-bottom:#FFFFFF;
    --ink:#000000;
    --muted:#44586A;
    --link:#1B4F72;
    --rule:rgba(0,0,0,0.16);
    --measure:34rem;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,
      var(--grad-top) 0%,
      var(--grad-mid) 38%,
      var(--grad-bottom) 72%,
      var(--grad-bottom) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Newsreader',Georgia,serif;
    font-size:19px;
    line-height:1.65;
    font-optical-sizing:auto;
  }

  .wrap{
    max-width:46rem;
    margin:0 auto;
    padding:clamp(3rem,9vw,6.5rem) 1.5rem 4rem;
  }

  a{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(27,79,114,0.32);}
  a:hover{border-bottom-color:var(--link);}
  a:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:2px;}

  /* ---------- masthead ---------- */
  .tagline{
    font-style:italic;
    font-weight:300;
    font-size:1.05rem;
    color:var(--muted);
    margin:0 0 1.1rem;
  }
  .name{
    font-weight:400;
    font-size:clamp(2rem,4.5vw,2.75rem);
    line-height:1.1;
    letter-spacing:-0.016em;
    margin:0 0 2.75rem;
  }

  /* ---------- bio (hidden unless written) ---------- */
  .bio{max-width:var(--measure);}
  .bio:empty{display:none;}
  .bio p{margin:0 0 1.15rem;}
  .bio p:last-child{margin-bottom:0;}

  /* ---------- divider ---------- */
  .rule{
    border:0;
    border-top:1px solid var(--rule);
    margin:0 0 2rem;
    max-width:var(--measure);
  }
  .bio:not(:empty) ~ .rule{margin-top:3.25rem;}

  /* ---------- archive ---------- */
  .archive-heading{
    font-family:'Archivo',system-ui,sans-serif;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--muted);
    margin:0 0 1.75rem;
  }

  /* ---------- custom sections ---------- */
  .custom{
    max-width:var(--measure);
    margin-top:3.5rem;
    padding-top:2.25rem;
    border-top:1px solid var(--rule);
  }
  .custom h2{
    font-size:1.5rem;
    font-weight:500;
    letter-spacing:-0.012em;
    margin:0 0 0.9rem;
  }
  .custom p{margin:0 0 1.1rem;}
  .custom p:last-child{margin-bottom:0;}
  .custom ul{margin:0 0 1.1rem;padding-left:1.15rem;}
  .custom li{margin-bottom:0.3rem;}
  .custom h3{font-size:1.1rem;font-weight:600;margin:1.4rem 0 0.4rem;}

  .entry{
    display:grid;
    grid-template-columns:11rem 1fr;
    gap:1.5rem;
    padding:1.6rem 0;
    border-top:1px solid var(--rule);
    max-width:var(--measure);
  }
  .entry.no-image{grid-template-columns:1fr;}

  .entry-thumb{
    display:block;
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    background:rgba(255,255,255,0.55);
    border:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  a.entry-thumb-link{border-bottom:0;}

  .entry-title{
    font-size:1.26rem;
    font-weight:500;
    line-height:1.3;
    margin:0 0 0.3rem;
    letter-spacing:-0.008em;
  }
  .entry-title a{border-bottom:1px solid rgba(27,79,114,0.28);}

  .entry-meta{
    font-family:'Archivo',system-ui,sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    margin:0 0 0.5rem;
  }
  .entry-summary{
    font-size:1rem;
    line-height:1.55;
    margin:0;
    color:#14222C;
  }



  .empty{
    color:var(--muted);
    font-style:italic;
    max-width:var(--measure);
  }

  /* ---------- footer ---------- */
  footer{
    margin-top:3.5rem;
    padding-top:1.5rem;
    border-top:1px solid var(--rule);
    max-width:var(--measure);
    font-family:'Archivo',system-ui,sans-serif;
    font-size:0.82rem;
    color:var(--muted);
  }
  .contact{margin:0 0 0.9rem;}
  .contact a{margin-right:1.1rem;}
  .colophon{margin:0;font-size:0.76rem;}

  @media (max-width:40rem){
    body{font-size:18px;}
    .entry{grid-template-columns:1fr;gap:0.9rem;}
    .entry-thumb{max-width:16rem;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;}
  }
</style>
</head>
<body>

<div class="wrap">

  <p class="tagline" id="tagline">markets, models, and the math underneath</p>
  <h1 class="name" id="name">Hi, I'm Matt.</h1>

  <div class="bio" id="bio"></div>

  <div id="sections"></div>

  <hr class="rule">

  <h2 class="archive-heading" id="archive-heading">Writing</h2>
  <div id="archive"></div>

  <footer>
    <p class="contact" id="contact"></p>
    <p class="colophon">© <span id="year"></span> Matt Ellison</p>
  </footer>

</div>

<script>
(function () {
  "use strict";

  var esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  var slugify = function (s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .replace(/[‐-―]/g, "-")
      .replace(/['’]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 80);
  };

  // Only allow http(s), mailto, and same-site relative links.
  var safeUrl = function (u) {
    var s = String(u == null ? "" : u).trim();
    if (!s) return "";
    if (/^(https?:|mailto:)/i.test(s)) return s;
    if (/^[\w\-./#?=&%]+$/.test(s) && !/^\/\//.test(s)) return s;
    return "";
  };

  // Minimal markdown: paragraphs, headings, lists, links, bold, italic.
  var inline = function (t) {
    return esc(t)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
        var u = safeUrl(href.replace(/&amp;/g, "&"));
        if (!u) return label;
        var ext = /^https?:/i.test(u) ? ' target="_blank" rel="noopener noreferrer"' : "";
        return '<a href="' + esc(u) + '"' + ext + ">" + label + "</a>";
      })
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  };

  var markdown = function (src) {
    var blocks = String(src == null ? "" : src).replace(/\r\n/g, "\n").split(/\n{2,}/);
    var out = "";
    blocks.forEach(function (b) {
      b = b.trim();
      if (!b) return;
      if (/^###?\s+/.test(b)) { out += "<h3>" + inline(b.replace(/^###?\s+/, "")) + "</h3>"; return; }
      if (/^[-*]\s+/m.test(b) && b.split("\n").every(function (l) { return /^[-*]\s+/.test(l.trim()); })) {
        out += "<ul>" + b.split("\n").map(function (l) {
          return "<li>" + inline(l.trim().replace(/^[-*]\s+/, "")) + "</li>";
        }).join("") + "</ul>";
        return;
      }
      out += "<p>" + inline(b).replace(/\n/g, "<br>") + "</p>";
    });
    return out;
  };

  var fmtDate = function (d) {
    if (!d) return "";
    var parts = String(d).slice(0, 10).split("-");
    if (parts.length !== 3) return esc(d);
    var dt = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
    if (isNaN(dt.getTime())) return esc(d);
    return dt.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  };

  var getJSON = function (url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  };

  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---------- site settings ---------- */
  getJSON("site.json").then(function (s) {
    if (!s || typeof s !== "object") return;

    if (s.colors && typeof s.colors === "object") {
      var map = {
        gradient_top: "--grad-top",
        gradient_mid: "--grad-mid",
        gradient_bottom: "--grad-bottom",
        text: "--ink",
        muted: "--muted",
        link: "--link"
      };
      Object.keys(map).forEach(function (k) {
        var v = s.colors[k];
        if (typeof v === "string" && /^#[0-9a-f]{3,8}$/i.test(v.trim())) {
          document.documentElement.style.setProperty(map[k], v.trim());
        }
      });
    }

    if (s.tagline) document.getElementById("tagline").textContent = s.tagline;
    if (s.name) document.getElementById("name").textContent = s.name;
    if (s.bio) document.getElementById("bio").innerHTML = markdown(s.bio);
    if (s.archive_heading) document.getElementById("archive-heading").textContent = s.archive_heading;

    var links = [];
    if (s.email) links.push('<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + "</a>");
    if (s.phone) links.push(esc(s.phone));
    if (s.linkedin && safeUrl(s.linkedin)) {
      links.push('<a href="' + esc(safeUrl(s.linkedin)) + '" target="_blank" rel="noopener noreferrer">LinkedIn</a>');
    }
    if (s.github && safeUrl(s.github)) {
      links.push('<a href="' + esc(safeUrl(s.github)) + '" target="_blank" rel="noopener noreferrer">GitHub</a>');
    }
    document.getElementById("contact").innerHTML = links.join("");
  }).catch(function () { /* baked-in defaults stay */ });

  /* ---------- custom sections ---------- */
  getJSON("sections.json").then(function (data) {
    var list = (data && Array.isArray(data.sections)) ? data.sections : [];
    var host = document.getElementById("sections");
    var html = list.filter(function (s) {
      return s && s.show !== false && (s.heading || s.body);
    }).map(function (s) {
      return '<section class="custom">' +
        (s.heading ? "<h2>" + esc(s.heading) + "</h2>" : "") +
        (s.body ? markdown(s.body) : "") +
      "</section>";
    }).join("");
    host.innerHTML = html;
  }).catch(function () { /* no sections file is fine */ });

  /* ---------- archive ---------- */
  getJSON("posts.json").then(function (data) {
    var posts = (data && Array.isArray(data.posts)) ? data.posts.slice() : [];
    var host = document.getElementById("archive");

    posts = posts.filter(function (p) { return p && p.title; });
    posts.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });

    if (!posts.length) {
      host.innerHTML = '<p class="empty">Nothing published yet.</p>';
      return;
    }

    host.innerHTML = posts.map(function (p) {
      // An explicit link wins; otherwise a written post gets its own page.
      var url = safeUrl(p.link);
      if (!url && p.body && String(p.body).trim()) {
        url = "/writing/" + slugify(p.slug || p.title);
      }
      var img = safeUrl(p.image);
      var ext = /^https?:/i.test(url) ? ' target="_blank" rel="noopener noreferrer"' : "";

      var title = url
        ? '<a href="' + esc(url) + '"' + ext + ">" + esc(p.title) + "</a>"
        : esc(p.title);

      var meta = [];
      if (p.category) meta.push(esc(p.category));
      if (p.date) meta.push(fmtDate(p.date));

      var thumb = "";
      if (img) {
        var tag = '<img class="entry-thumb" src="' + esc(img) + '" alt="" loading="lazy">';
        thumb = url
          ? '<a class="entry-thumb-link" href="' + esc(url) + '"' + ext + " tabindex=\"-1\" aria-hidden=\"true\">" + tag + "</a>"
          : tag;
      }

      return (
        '<article class="entry' + (img ? "" : " no-image") + '">' +
          (img ? "<div>" + thumb + "</div>" : "") +
          "<div>" +
            '<h3 class="entry-title">' + title + "</h3>" +
            (meta.length ? '<p class="entry-meta">' + meta.join(", ") + "</p>" : "") +
            (p.summary ? '<p class="entry-summary">' + inline(p.summary) + "</p>" : "") +
          "</div>" +
        "</article>"
      );
    }).join("");
  }).catch(function () {
    document.getElementById("archive").innerHTML = '<p class="empty">Nothing published yet.</p>';
  });

  /* ---------- send a confirmed Identity invite straight to the editor ---------- */
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin.html";
        });
      }
    });
  }
})();
</script>

</body>
</html>
